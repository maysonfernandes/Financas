name: Executar Financas

on:
  workflow_dispatch:
  # Opcional: agendamento diário (ex.: 21h UTC)
  # schedule:
  - cron: "0 17 * * 1-5"

permissions:
  contents: write

jobs:
  executar-financas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar script de finanças e atualizar README
        run: |
          # 1. Execute seu script (ele deve salvar dados/imagens, ex.: em data/ e assets/)
          python financas.py

          # 2. Atualize o bloco marcado no README.md
          python - <<'EOF'
          from datetime import datetime
          from pathlib import Path

          readme_path = Path("README.md")
          conteudo = readme_path.read_text(encoding="utf-8")

          inicio = "<!-- FINANCAS_START -->"
          fim = "<!-- FINANCAS_END -->"

          agora = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          bloco_novo = f"""{inicio}
          Última atualização: **{agora}**

          - Dados salvos em: `Dados_Colab/resumo.csv`
          - Gráfico atualizado:

          ![Gráfico Financeiro](Financas/grafico.png)
          {fim}"""

          if inicio in conteudo and fim in conteudo:
              parte_antes = conteudo.split(inicio)[0]
              parte_depois = conteudo.split(fim)[1]
              atualizado = parte_antes + bloco_novo + parte_depois
          else:
              atualizado = conteudo.rstrip() + "\n\n" + bloco_novo + "\n"

          readme_path.write_text(atualizado, encoding="utf-8")
          EOF

      - name: Salvar dados, imagens e README no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Adicione as pastas/arquivos gerados pelo seu script + README.md
          git add README.md data/ assets/

          if git diff --staged --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: atualiza dados financeiros e README [skip ci]"
            git push
          fi

name: Executar Financas

on:
  schedule:
    # 21:00 UTC = 18:00 no horário de Brasília (UTC-3), de segunda a sexta
    - cron: "0 21 * * 1-5"
  workflow_dispatch: # Habilita o botão "Run workflow" manual na aba Actions

permissions:
  contents: write # Necessário apenas se o script for salvar/atualizar arquivos no repositório

jobs:
  rodar-financas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance matplotlib pillow rembg
      - name: Executar financas.py
        run: python financas.py

      - name: Salvar alterações geradas no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Atualiza saídas do financas.py"
          git push
